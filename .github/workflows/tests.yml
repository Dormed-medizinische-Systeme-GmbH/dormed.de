name: tests

# Pest-Testsuite fuer jeden Pull Request. Der Job "pest" ist in GitHub als
# Pflicht-Check fuer main hinterlegt (Settings -> Rules), damit nur gruene
# PRs gemergt werden koennen.
#
# Zusaetzlich per workflow_call aus deploy.yml aufgerufen: auch ein direkter
# Push auf main oder ein manueller Deploy laeuft erst nach gruenen Tests.
on:
  pull_request:
  workflow_call:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  pest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: pcov

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Composer-Cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      # Die Seiten binden Assets per @vite ein - ohne Manifest scheitern die
      # Seiten-Tests (StaticPagesTest) mit einer ViteException.
      - name: Frontend bauen
        run: npm run build

      - name: Laravel vorbereiten
        run: |
          cp .env.example .env
          php artisan key:generate

      # Coverage per PCOV (schneller als Xdebug). Ausgabe und JUnit-Log werden
      # danach zum Testbericht (PR-Kommentar + Job-Zusammenfassung) verarbeitet.
      - name: Tests mit Coverage
        run: |
          set -o pipefail
          php artisan test --compact --coverage --log-junit junit.xml | tee pest-output.txt

      - name: Testbericht erstellen
        if: always()
        run: |
          python3 .github/scripts/test-report.py junit.xml pest-output.txt test-report.md
          cat test-report.md >> "$GITHUB_STEP_SUMMARY"

      # Ein Kommentar pro PR, der bei jedem Lauf aktualisiert wird (erkannt am
      # Marker <!-- test-report --> in der ersten Zeile).
      - name: Testbericht als PR-Kommentar
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('test-report.md')) {
              return;
            }
            const body = fs.readFileSync('test-report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body?.startsWith('<!-- test-report -->'));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
